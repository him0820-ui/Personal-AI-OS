server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: personal-ai-os
  
  datasource:
    url: jdbc:mysql://localhost:3306/personal_ai_os?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  sql:
    init:
      mode: never
  
  data:
    redis:
      # Migrated from VM(192.168.253.130) to local container, eliminating config split.
      # Local backend connects to local docker redis; application-docker.yml uses service name 'redis'.
      host: localhost
      port: 6379
      password: 123456
  
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: deepseek-r1:8b
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: memory
        initialize-schema: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/*.xml

jwt:
  secret: personal-ai-os-jwt-secret-key-2024
  expiration: 86400000

logging:
  level:
    com.personalai.os: DEBUG
    com.personalai.os.memory: DEBUG
    com.personalai.os.service: DEBUG
    com.personalai.os.config: DEBUG
    com.personalai.os.tool: DEBUG
    com.personalai.os.controller: DEBUG
    org.springframework.scheduling: DEBUG